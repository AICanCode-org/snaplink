openapi: 3.1.0
info:
  title: SnapLink API
  version: 1.0.0
  description: |
    Language-agnostic contract for the SnapLink URL shortener (AiCanCode project).
    All three implementation tracks (Java, Python, TypeScript) MUST satisfy this contract.
    Errors use RFC 9457 `application/problem+json`.
  license:
    name: MIT
servers:
  - url: http://localhost:8080
    description: Local (docker compose or `make run`)
tags:
  - name: links
  - name: redirect
  - name: analytics
  - name: ops
paths:
  /health:
    get:
      tags: [ops]
      summary: Liveness + dependency health
      operationId: getHealth
      responses:
        "200":
          description: Service is up (cache may be degraded)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Database unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /api/v1/links:
    post:
      tags: [links]
      summary: Create a short link
      operationId: createLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLinkRequest" }
            examples:
              random: { value: { url: "https://www.aicancode.org/projects" } }
              alias: { value: { url: "https://www.aicancode.org", alias: "aicancode", expiresInDays: 30 } }
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of the created link resource
              schema: { type: string, example: /api/v1/links/aB3dE9x }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Link" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: Alias already taken
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /api/v1/links/{code}:
    parameters:
      - $ref: "#/components/parameters/Code"
    get:
      tags: [links]
      summary: Get link details (includes expired links)
      operationId: getLink
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Link" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [links]
      summary: Delete a link (and its analytics)
      operationId: deleteLink
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/links/{code}/stats:
    parameters:
      - $ref: "#/components/parameters/Code"
      - name: days
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
    get:
      tags: [analytics]
      summary: Daily click counts for the last N days (UTC, zero-filled, oldest first)
      operationId: getStats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/links/{code}/insights:
    parameters:
      - $ref: "#/components/parameters/Code"
    get:
      tags: [analytics]
      summary: Plain-English summary of the last 7 days of clicks
      description: |
        Uses the template generator by default (offline, deterministic). When
        `INSIGHTS_PROVIDER=llm`, calls an OpenAI-compatible endpoint (Ollama, Gemini, Groq).
        If the LLM fails or times out, the template is used and `fallback` is true.
      operationId: getInsights
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Insight" }
        "404": { $ref: "#/components/responses/NotFound" }
  /{code}:
    parameters:
      - $ref: "#/components/parameters/Code"
    get:
      tags: [redirect]
      summary: Redirect to the long URL and record a click
      operationId: redirect
      responses:
        "302":
          description: Found
          headers:
            Location: { schema: { type: string } }
            Cache-Control: { schema: { type: string, example: no-store } }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: Link expired
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  parameters:
    Code:
      name: code
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{3,32}$" }
  responses:
    ValidationError:
      description: Invalid input
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No link with that code
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    CreateLinkRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          maxLength: 2048
          description: Absolute http(s) URL. SnapLink never fetches it.
        alias:
          type: string
          pattern: "^[A-Za-z0-9_-]{3,32}$"
          description: Optional custom code. Reserved words (api, health, metrics, docs, admin, static) are rejected.
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
    Link:
      type: object
      required: [code, shortUrl, url, custom, createdAt, expiresAt, clickCount]
      properties:
        code: { type: string, example: aB3dE9x }
        shortUrl: { type: string, example: http://localhost:8080/aB3dE9x }
        url: { type: string }
        custom: { type: boolean }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        clickCount: { type: integer, format: int64 }
    DailyClicks:
      type: object
      required: [date, clicks]
      properties:
        date: { type: string, format: date, example: "2026-10-02" }
        clicks: { type: integer, format: int64 }
    Stats:
      type: object
      required: [code, totalClicks, days, daily]
      properties:
        code: { type: string }
        totalClicks: { type: integer, format: int64, description: All-time clicks }
        days: { type: integer }
        daily:
          type: array
          items: { $ref: "#/components/schemas/DailyClicks" }
    Insight:
      type: object
      required: [code, provider, fallback, summary, generatedAt]
      properties:
        code: { type: string }
        provider: { type: string, enum: [template, llm] }
        fallback: { type: boolean, description: true when the LLM failed and the template was used }
        summary: { type: string }
        generatedAt: { type: string, format: date-time }
    Health:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [UP, DOWN] }
        checks:
          type: object
          required: [database, cache]
          properties:
            database: { type: string, enum: [UP, DOWN] }
            cache: { type: string, enum: [UP, DOWN, DISABLED] }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, example: "https://snaplink.dev/problems/validation-error" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
